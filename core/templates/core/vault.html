<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniQuant | Biometric Authentication</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --theme-color: #00f3ff;
            --theme-dim: rgba(0, 243, 255, 0.15);
            --theme-glow: rgba(0, 243, 255, 0.6);
            --j-bg: #010205;
        }

        body, html {
            margin: 0; padding: 0; background: var(--j-bg); 
            font-family: 'Rajdhani', sans-serif; color: var(--theme-color);
            overflow: hidden; width: 100vw; height: 100vh; display: flex;
            flex-direction: column; justify-content: center; align-items: center;
            
            /* Deep Space Holographic Grid */
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(0, 243, 255, 0.05) 0%, var(--j-bg) 60%),
                linear-gradient(var(--theme-dim) 1px, transparent 1px),
                linear-gradient(90deg, var(--theme-dim) 1px, transparent 1px);
            background-size: 100% 100%, 40px 40px, 40px 40px;
            background-position: center center;
        }

        /* --- THE ARC REACTOR CORE --- */
        .reactor-container {
            position: relative; width: 350px; height: 350px;
            display: flex; justify-content: center; align-items: center;
            margin-bottom: 40px; transition: all 1s ease;
        }

        /* The Rings */
        .ring { position: absolute; border-radius: 50%; border: 2px solid transparent; transition: all 1s ease; }
        
        .ring-1 {
            width: 350px; height: 350px;
            border-top: 2px solid var(--theme-color); border-bottom: 2px solid var(--theme-color);
            animation: spin 15s linear infinite; opacity: 0.3;
        }
        .ring-2 {
            width: 300px; height: 300px;
            border: 2px dashed var(--theme-color);
            animation: spin-reverse 20s linear infinite; opacity: 0.5;
        }
        .ring-3 {
            width: 250px; height: 250px;
            border-left: 4px solid var(--theme-color); border-right: 4px solid var(--theme-color);
            animation: spin 10s linear infinite; box-shadow: 0 0 30px var(--theme-dim) inset;
        }
        .ring-core {
            width: 180px; height: 180px; background: rgba(0, 243, 255, 0.05);
            border-radius: 50%; border: 1px solid var(--theme-glow);
            box-shadow: 0 0 50px var(--theme-dim);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            backdrop-filter: blur(5px); z-index: 10;
        }

        /* Typography inside Core */
        h1 { font-size: 2.2rem; font-weight: 700; margin: 0; letter-spacing: 4px; text-shadow: 0 0 15px var(--theme-color); text-align: center; line-height: 1; }
        h1 span { display: block; font-weight: 300; opacity: 0.7; font-size: 1.2rem; letter-spacing: 8px; margin-top: 5px; }
        
        /* --- OVERDRIVE ANIMATIONS (Triggered by JS) --- */
        .charging .ring-1 { animation: spin 1s linear infinite; opacity: 1; border-color: #fff; box-shadow: 0 0 40px var(--theme-color); }
        .charging .ring-2 { animation: spin-reverse 0.8s linear infinite; opacity: 1; border-color: var(--theme-color); }
        .charging .ring-3 { animation: spin 0.5s linear infinite; border-color: #fff; box-shadow: 0 0 60px var(--theme-color); }
        .charging .ring-core { background: rgba(0, 243, 255, 0.2); box-shadow: 0 0 100px var(--theme-color); }

        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes spin-reverse { 100% { transform: rotate(-360deg); } }

        /* --- THE UPLINK BUTTON --- */
        .auth-wrapper { position: relative; z-index: 20; }
        .auth-btn {
            background: rgba(0, 10, 20, 0.8); border: 1px solid var(--theme-glow);
            color: var(--theme-color); font-family: 'Share Tech Mono', monospace;
            font-size: 1.2rem; padding: 15px 50px; cursor: pointer;
            text-transform: uppercase; letter-spacing: 4px; transition: 0.3s;
            position: relative; overflow: hidden; backdrop-filter: blur(10px);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.1);
        }
        .auth-btn::before, .auth-btn::after {
            content: ''; position: absolute; width: 10px; height: 10px; border: 2px solid var(--theme-color);
        }
        .auth-btn::before { top: 0; left: 0; border-right: none; border-bottom: none; }
        .auth-btn::after { bottom: 0; right: 0; border-left: none; border-top: none; }
        .auth-btn:hover { background: var(--theme-dim); box-shadow: 0 0 30px var(--theme-glow); text-shadow: 0 0 10px #fff; }

        /* --- TERMINAL READOUT --- */
        .terminal-log {
            font-family: 'Share Tech Mono', monospace; font-size: 0.9rem;
            color: #fff; margin-top: 30px; min-height: 60px; text-align: center;
            text-shadow: 0 0 5px var(--theme-color); opacity: 0.9;
        }
        .welcome-text { font-size: 1.5rem; font-weight: bold; color: #fff; letter-spacing: 3px; text-shadow: 0 0 20px var(--theme-color); display: none; margin-top: 15px; }

        /* --- WARP TRANSITION --- */
        .warp-speed { animation: warpTransition 1.2s forwards cubic-bezier(0.7, 0, 0.3, 1); pointer-events: none; }
        @keyframes warpTransition { 
            0% { filter: brightness(1); transform: scale(1); }
            50% { filter: brightness(3) contrast(2); transform: scale(1.5); opacity: 1; }
            100% { filter: brightness(10) blur(20px); transform: scale(3); opacity: 0; }
        }

        /* Screen flash */
        #flash { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #fff; opacity: 0; pointer-events: none; z-index: 9999; }
        .flash-bang { animation: flashBang 1.2s forwards; }
        @keyframes flashBang { 0% { opacity: 0; } 50% { opacity: 1; } 100% { opacity: 1; } }

    </style>
</head>
<body>

    <div id="flash"></div>

    <div class="reactor-container" id="reactor">
        <div class="ring ring-1"></div>
        <div class="ring ring-2"></div>
        <div class="ring ring-3"></div>
        <div class="ring-core">
            <h1>OMNI<span>QUANT</span></h1>
        </div>
    </div>

    <div class="auth-wrapper">
        <button class="auth-btn" id="auth-btn" onclick="initiateUplink()">
            [ INITIATE UPLINK ]
        </button>
    </div>

    <div class="terminal-log" id="log-output">
        SYS.STAT: AWAITING USER CLEARANCE...
    </div>
    
    <div class="welcome-text" id="welcome-msg">WELCOME, ADMINISTRATOR.</div>

    <script>
        function initiateUplink() {
            const btn = document.getElementById('auth-btn');
            const log = document.getElementById('log-output');
            const reactor = document.getElementById('reactor');
            const welcome = document.getElementById('welcome-msg');
            const flash = document.getElementById('flash');

            // 1. Lock the button
            btn.style.pointerEvents = 'none';
            btn.style.opacity = '0';
            setTimeout(() => btn.style.display = 'none', 300);

            // 2. Trigger Reactor Overdrive
            reactor.classList.add('charging');

            // 3. The Power-Up Boot Sequence
            const sequence = [
                "ACTIVATING LLAMA 3.2 NEURAL NET...",
                "CALIBRATING FACIAL LANDMARK MATRIX...",
                "SYNCING LIVE MARKET PROTOCOLS...",
                "BIOMETRIC THRESHOLD VERIFIED [EAR > 0.20].",
                "SECURITY CLEARANCE LEVEL: OMNI."
            ];

            let step = 0;
            const bootInterval = setInterval(() => {
                // Typewriter effect logic
                typeText(log, `> ${sequence[step]}`);
                step++;

                // Sequence Complete
                if (step >= sequence.length) {
                    clearInterval(bootInterval);
                    
                    // Pause for a split second, then show the Welcome Message
                    setTimeout(() => {
                        log.style.display = 'none';
                        welcome.style.display = 'block';
                        
                        // Type the welcome message
                        typeText(welcome, "WELCOME, ADMINISTRATOR. SYSTEMS ONLINE.");

                        // 4. Trigger Warp Speed Transition
                        setTimeout(() => {
                            document.body.classList.add('warp-speed');
                            flash.classList.add('flash-bang');

                            // Redirect to Dashboard
                            setTimeout(() => {
                                window.location.href = '/dashboard/';
                            }, 1000); // Redirects right when the screen goes blind white
                        }, 1500); // How long the welcome message stays on screen

                    }, 800);
                }
            }, 900); // Speed of the log messages
        }

        // Helper function for the J.A.R.V.I.S. typewriter effect
        function typeText(element, text) {
            element.innerHTML = '';
            let i = 0;
            const typing = setInterval(() => {
                if (i < text.length) {
                    element.innerHTML += text.charAt(i);
                    i++;
                } else {
                    clearInterval(typing);
                }
            }, 15); // Speed of individual character typing
        }
    </script>
</body>
</html>
