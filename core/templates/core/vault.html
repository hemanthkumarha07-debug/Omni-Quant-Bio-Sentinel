<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;800&family=Nanum+Brush+Script&display=swap" rel="stylesheet">
    <style>
        :root {
            --fusion-indigo: #6366f1;
            --fusion-purple: #a855f7;
            --fusion-bg: #030712;
            --glass-shine: rgba(255, 255, 255, 0.05);
        }

        body, html {
            margin: 0; padding: 0; height: 100%; width: 100%;
            background: var(--fusion-bg);
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow: hidden; color: white;
        }

        /* Fusion Art Mesh Gradient Background */
        .fusion-universe {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: 
                radial-gradient(circle at 20% 30%, rgba(99, 102, 241, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(168, 85, 247, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(30, 27, 75, 1) 0%, var(--fusion-bg) 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 1; text-align: center;
        }

        /* Frosted Glass Doors */
        .door {
            position: fixed; top: 0; width: 50.5%; height: 100vh;
            background: var(--glass-shine);
            backdrop-filter: blur(45px); -webkit-backdrop-filter: blur(45px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: transform 2.2s cubic-bezier(0.8, 0, 0.1, 1);
            z-index: 100; pointer-events: none;
        }

        .left-door { left: 0; border-right: 1px solid rgba(255, 255, 255, 0.2); }
        .right-door { right: 0; border-left: 1px solid rgba(255, 255, 255, 0.2); }

        /* Door Branding */
        .door h1 {
            font-size: 4.5rem; font-weight: 800; letter-spacing: -3px;
            background: linear-gradient(to bottom, #fff, #94a3b8);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin: 0;
        }

        .door-version {
            font-size: 0.9rem; letter-spacing: 5px; opacity: 0.4;
            margin-top: 10px; font-weight: 200;
        }

        /* Welcome Message (Brush Script) */
        .welcome-title {
            font-family: 'Nanum Brush Script', cursive;
            font-size: 4.8rem; font-weight: bold;
            background: linear-gradient(45deg, var(--fusion-indigo), #fff);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 0; text-shadow: 0 10px 40px rgba(99, 102, 241, 0.3);
        }

        .tagline {
            font-weight: 200; opacity: 0.5; font-size: 1rem;
            letter-spacing: 6px; text-transform: uppercase; margin-top: 5px; margin-bottom: 50px;
        }

        /* Attractive Launch Button */
        .launch-btn {
            background: white; color: black; border: none;
            padding: 22px 70px; border-radius: 100px;
            font-weight: 800; font-size: 1.1rem; cursor: pointer;
            transition: 0.5s cubic-bezier(0.2, 1, 0.2, 1);
            box-shadow: 0 15px 50px rgba(99, 102, 241, 0.3);
            text-transform: uppercase; letter-spacing: 3px;
            z-index: 150; position: relative;
        }

        .launch-btn:hover {
            transform: scale(1.08) translateY(-5px);
            background: var(--fusion-indigo); color: white;
            box-shadow: 0 25px 70px rgba(99, 102, 241, 0.6);
        }

        /* Animation Trigger */
        .vault-active .left-door { transform: translateX(-100%); opacity: 0; }
        .vault-active .right-door { transform: translateX(100%); opacity: 0; }
    </style>
</head>
<body id="master-shell">

    <div class="door left-door">
        <h1>OMNI</h1>
        <div class="door-version">INITIATED</div>
    </div>
    <div class="door right-door">
        <h1>QUANT</h1>
        <div class="door-version">SYSTEMS 3.2</div>
    </div>

    <div class="fusion-universe">
        <h2 class="welcome-title">Welcome to Omni Quant: Bio-Sentinel</h2>
        <div class="tagline">Master the market, Secure the mind</div>
        
        <button class="launch-btn" onclick="engageSystem()">
            Initiate Pulse
        </button>
    </div>

    <script>
        function engageSystem() {
            const shell = document.getElementById('master-shell');
            shell.classList.add('vault-active');
            
            // Redirect to Dashboard after the hydraulic animation
            setTimeout(() => {
                window.location.href = "/dashboard/";
            }, 2200);
        }
    </script>
</body>
</html>
