{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;800&family=Nanum+Brush+Script&display=swap" rel="stylesheet">
    <style>
        :root {
            --fusion-indigo: #6366f1; --bg-deep: #030712; --glass: rgba(255, 255, 255, 0.03);
            --emergency-red: #ff3131; --success-green: #39ff14;
        }

        body, html {
            margin: 0; background: var(--bg-deep); font-family: 'Plus Jakarta Sans', sans-serif;
            color: white; overflow: hidden; width: 100vw; height: 100vh;
        }

        /* --- THE CIRCUIT BREAKER --- */
        #stress-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 9999; opacity: 0; transition: opacity 0.8s ease;
            background: radial-gradient(circle, transparent 20%, rgba(255, 0, 0, 0.3) 100%);
        }
        #main-viewport { transition: filter 0.5s ease; width: 100%; height: 100%; display: flex; flex-direction: column; }
        .system-lockdown { filter: url(#heavy-blur) grayscale(1) !important; pointer-events: none !important; }

        /* --- HEADER & DYNAMIC NAV --- */
        .master-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 40px; background: rgba(3, 7, 18, 0.9); backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(255,255,255,0.05); z-index: 1000;
        }
        .brush-branding { font-family: 'Nanum Brush Script', cursive; font-size: 2rem; background: linear-gradient(45deg, var(--fusion-indigo), #fff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .market-nav { display: flex; align-items: center; gap: 20px; }
        .nav-link { text-decoration: none; color: rgba(255,255,255,0.4); font-size: 0.75rem; font-weight: 800; letter-spacing: 1px; cursor: pointer; transition: 0.3s; }
        .nav-link.active { color: var(--fusion-indigo); }

        /* SEARCH BAR */
        .search-box input {
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 100px; padding: 6px 15px; color: white; font-size: 0.7rem; outline: none; width: 200px;
        }

        /* --- GRID LAYOUT --- */
        .dashboard-grid { display: grid; grid-template-columns: 2.5fr 1fr; gap: 25px; padding: 25px; flex-grow: 1; }
        .glass-card { background: var(--glass); border: 1px solid rgba(255,255,255,0.1); border-radius: 24px; padding: 25px; backdrop-filter: blur(20px); }
        
        #chart-container { height: 400px; border-radius: 15px; overflow: hidden; margin-bottom: 20px; }
    </style>
</head>
<body>

    <svg style="position: absolute; width: 0; height: 0;"><filter id="heavy-blur"><feGaussianBlur stdDeviation="12" /></filter></svg>
    <div id="stress-overlay"></div>

    <div id="main-viewport">
        <header class="master-header">
            <h1 class="brush-branding">Omni Quant: Bio-Sentinel</h1>
            
            <nav class="market-nav">
                <div class="search-box"><input type="text" id="m-search" placeholder="SEARCH ASSET..."></div>
                <span class="nav-link active" onclick="switchSegment('STOCKS', 'NSE:NIFTY')">STOCKS</span>
                <span class="nav-link" onclick="switchSegment('FOREX', 'FX:EURUSD')">FOREX</span>
                <span class="nav-link" onclick="switchSegment('CRYPTO', 'BINANCE:BTCUSDT')">CRYPTO</span>
                <span class="nav-link" onclick="switchSegment('COMMODITY', 'TVC:GOLD')">COMMODITY</span>
                <span class="nav-link" onclick="switchSegment('OPTIONS', 'NSE:NIFTY')">OPTIONS</span>
            </nav>

            <div class="status-pill" style="display:flex; align-items:center; gap:10px; background:rgba(255,255,255,0.05); padding:5px 15px; border-radius:100px;">
                <div id="s-ring" style="width:8px; height:8px; border-radius:50%; background:#10b981; box-shadow:0 0 10px #10b981;"></div>
                <span id="s-label" style="font-size:0.7rem; font-weight:800;">STABLE</span>
            </div>
        </header>

        <div class="dashboard-grid">
            <div class="glass-card" style="display:flex; flex-direction:column;">
                <h2 id="seg-title" style="font-weight:200; margin:0 0 15px 0;">STOCKS INTELLIGENCE</h2>
                
                <div id="chart-container">
                    <div id="tv_chart"></div>
                </div>

                <div id="data-table-area">
                    <p style="opacity:0.4; font-size:0.8rem;">Syncing Segment Data...</p>
                </div>
            </div>

            <div class="sidebar" style="display:flex; flex-direction:column; gap:25px;">
                <div class="glass-card" style="border-top: 4px solid var(--fusion-indigo);">
                    <h3 style="font-size:0.7rem; color:var(--fusion-indigo); letter-spacing:2px; margin-top:0;">AI SENTINEL</h3>
                    <p id="ai-insight" style="opacity:0.7; font-size:0.85rem; line-height:1.6;">Initializing Llama 3.2 Reasoning...</p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://s3.tradingview.com/tv.js"></script>
    <script>
        let currentSegment = 'STOCKS';

        function switchSegment(seg, symbol) {
            currentSegment = seg;
            document.getElementById('seg-title').innerText = seg + " INTELLIGENCE";
            document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
            event.target.classList.add('active');

            // Update Chart
            new TradingView.widget({
                "autosize": true, "symbol": symbol, "interval": "D", "timezone": "Etc/UTC",
                "theme": "dark", "style": "1", "container_id": "tv_chart", "hide_top_toolbar": true
            });

            updateAI();
        }

        async function updateAI() {
            const ear = document.getElementById('s-label').innerText === "STABLE" ? 0.25 : 0.15;
            const res = await fetch(`/get-ai-insight/?segment=${currentSegment}&ear=${ear}`);
            const data = await res.json();
            document.getElementById('ai-insight').innerText = data.insight;
        }

        // Initialize first chart
        switchSegment('STOCKS', 'NSE:NIFTY');
        setInterval(updateAI, 5000);
    </script>
    <script src="{% static 'js/sentinel.js' %}"></script>
</body>
</html>
